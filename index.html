#site{--bg:#020617;--s9:#0f172a;--s8:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--dim:#64748b;--sky:#38bdf8;--sky5:#0ea5e9;--amb:#fbbf24;--grn:#34d399;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.cc-btns .go{background:var(--sky);border-color:var(--sky);color:var(--onsky)}.cc-btns button:hover{border-color:var(--sky)}
.cc-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem}.cc-row input{margin-top:3px;width:auto}.cc-row small{display:block;color:var(--muted)}
.nudge{background:var(--panel);border-bottom:1px solid var(--sky);padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem}.nudge span{flex:1;min-width:200px}.nudge .rsx{width:30px;height:30px}
#site .lfoot button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}#site .lfoot button:hover{color:var(--ink)}
.phone-row{display:flex;gap:8px}.phone-row select{width:112px;flex:none}.phone-row input{flex:1;min-width:0}


/* New group / Group info: same pop-up look, visible scrollbar on the left, stays open until saved or X */
#sheet.lsb{overflow:hidden}
#sheet.lsb .card{display:flex;flex-direction:column;max-height:calc(100dvh - 32px);overflow:hidden;padding:0}
#sheet.lsb #sheet-title{margin:0!important;padding:22px 56px 12px 28px}
#sheet.lsb #sheet-body{flex:1;min-height:0;overflow-y:scroll;padding:0 16px 28px 28px;scrollbar-width:auto;scrollbar-color:var(--sky) var(--panel)}
#sheet.gi .card{max-height:calc(100dvh - 64px)}
#sheet.lsb .close{top:14px;right:16px;z-index:2}
/* profile: phone number box matches the home page (dark, white Cormorant Garamond) */
#pp-pn .cp{--cp-bg:#0f172a;--cp-bd:#1e293b;--cp-ink:#fff;--cp-mut:#94a3b8;--cp-hov:#1e293b;--cp-fld:#0f172a}
#pp-pn .cp-btn,#pp-pn .cp-dd,#pp-pn .cp-dd *{font-family:'Cormorant Garamond',serif;color:#fff}
#pp-pn .cp-btn{font-size:1.1rem;font-weight:600}
#pp-pn .cp-l li{font-size:1.05rem}
#pp-pn .cp-l li b,#pp-pn .cp-ar{color:#94a3b8}
#pp-pn #pn-input{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;color:#fff;font:600 1.1rem 'Cormorant Garamond',serif}
#profile #pn-input{background:#0f172a!important;color:#fff!important;color-scheme:dark;-webkit-text-fill-color:#fff}
#profile #pn-input:focus,#profile #pn-input:hover{background:#0f172a!important;color:#fff!important}
#profile #pn-input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px #0f172a inset!important;-webkit-text-fill-color:#fff!important;caret-color:#fff}
#pp-pn #pn-input::placeholder{color:#64748b}
#pp-pn #pn-input:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 1px #38bdf8}
#pp-pn .cp-s::placeholder{color:#64748b}
/* WhatsApp-style group chat */
#gmain{--wa-bg:#efeae2;--wa-head:#f0f2f5;--wa-in:#fff;--wa-out:#d9fdd3;--wa-ink:#111b21;--wa-mut:#667781;--wa-acc:#00a884;--wa-link:#027eb5;--wa-quote:rgba(11,20,26,.06);--wa-pill:#fff;--wa-pillbd:#d1d7db;--wa-line:#e9edef}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) #gmain{--wa-bg:#0b141a;--wa-head:#202c33;--wa-in:#202c33;--wa-out:#005c4b;--wa-ink:#e9edef;--wa-mut:#8696a0;--wa-acc:#00a884;--wa-link:#53bdeb;--wa-quote:rgba(0,0,0,.2);--wa-pill:#202c33;--wa-pillbd:#2a3942;--wa-line:#222d34}}
:root[data-theme=dark] #gmain{--wa-bg:#0b141a;--wa-head:#202c33;--wa-in:#202c33;--wa-out:#005c4b;--wa-ink:#e9edef;--wa-mut:#8696a0;--wa-acc:#00a884;--wa-link:#53bdeb;--wa-quote:rgba(0,0,0,.2);--wa-pill:#202c33;--wa-pillbd:#2a3942;--wa-line:#222d34}
#gmain .gtop{background:transparent;border-bottom:1px solid var(--line);color:var(--ink)}
#gmain .gtop .gt b{font-size:1rem;color:var(--ink)}
#gmain .gtop .gt small{font-size:.75rem;color:var(--muted);margin-top:2px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gmain .gmsgs{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;color:var(--ink)}
#gmain .gcol{gap:12px}
#gmain .gday,#gmain .gsys{background:var(--panel);color:var(--muted)}
#gmain .grow{max-width:85%;align-items:flex-end}
#gmain .gstack{display:flex;flex-direction:column;min-width:0;max-width:100%}
#gmain .grow.mine .gstack{align-items:flex-end}
#gmain .gb{display:block;margin-left:0;gap:0;background:var(--wa-in);color:var(--wa-ink);border:0;border-radius:0 8px 8px 8px;padding:8px 12px 6px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
#gmain .grow.mine .gb{background:var(--wa-out);border-radius:8px 0 8px 8px}
#gmain .grow.garo .gb{border-left:0;border-radius:0 8px 8px 8px}
#gmain .gn{font-size:.85rem;font-weight:600;margin-bottom:4px}
#gmain .grow.garo .gn{color:var(--wa-acc)}
#gmain .gb .gq{display:block;width:100%;text-align:left;background:var(--wa-quote);border:0;border-left:4px solid var(--wa-acc);border-radius:4px;padding:6px 8px;margin:0 0 6px;font-weight:400}
#gmain .gb .gmore{border:0;border-radius:0;padding:2px 6px;background:none}
#gmain .gq b{color:var(--wa-link);font-size:.75rem;font-weight:600}
#gmain .gq span{color:var(--wa-mut);font-size:.8rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gmain .gbody{font-size:.9rem;line-height:1.4;color:var(--wa-ink)}
#gmain .gb .gt{display:block;flex:none;font-size:.65rem;color:var(--wa-mut);text-align:right;margin-top:2px}
#gmain .grx{margin:4px 0 0 4px;gap:4px}
#gmain .grow.mine .grx{margin:4px 4px 0 0;justify-content:flex-end}
#gmain .rxc{background:var(--wa-pill);border:1px solid var(--wa-pillbd);color:var(--wa-ink);padding:2px 6px;border-radius:12px;font-size:.75rem}
#gmain .rxc.me{border-color:var(--wa-acc)}
#gmain .grow.hasrx>:not(.gstack){margin-bottom:26px}
#gmain .mention{color:var(--wa-link)}
/* searchable country-code picker */
.cp{position:relative;flex:none;--cp-bg:var(--card);--cp-bd:var(--line);--cp-ink:var(--ink);--cp-mut:var(--muted);--cp-hov:var(--panel);--cp-fld:var(--bg)}
#site .cp{--cp-bg:#0f172a;--cp-bd:#1e293b;--cp-ink:#f1f5f9;--cp-mut:#94a3b8;--cp-hov:#1e293b;--cp-fld:#0f172acc}
.cp-btn{display:flex;align-items:center;gap:6px;height:100%;min-height:42px;padding:0 10px;background:var(--cp-fld);border:1px solid var(--cp-bd);border-radius:8px;color:var(--cp-ink);cursor:pointer;white-space:nowrap;font-size:.92rem}
#site .cp-btn{border-radius:5px;font-family:var(--mono)}
.cp-btn:hover{border-color:var(--sky)}
.cp-ar{font-size:.7rem;color:var(--cp-mut)}
.cp-dd{position:fixed;z-index:60;display:flex;flex-direction:column;background:var(--cp-bg);color:var(--cp-ink);border:1px solid var(--cp-bd);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.35);overflow:hidden}
.cp-dd[hidden]{display:none}
.cp-dd .cp-s{width:100%;border:0;border-bottom:1px solid var(--cp-bd);border-radius:0;padding:10px 12px;background:var(--cp-fld);color:var(--cp-ink);font-size:.9rem;outline:none}
.cp-l{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.cp-l li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;font-size:.9rem}
.cp-l li:hover,.cp-l li.on{background:var(--cp-hov)}
.cp-l li b{font-weight:500;color:var(--cp-mut);flex:none}
.cp-l li.none{justify-content:center;color:var(--cp-mut);cursor:default}
.phone-row{align-items:stretch}
